# Retries queued messages and webhooks every 5 minutes. Vercel's Hobby plan runs cron jobs
# only once a day, so this does the frequent run instead (messages are also sent right away
# when an order changes; this picks up retries and anything that was missed).
# Needs two repository secrets: SITE_URL (e.g. https://autobartje.vercel.app) and CRON_SECRET
# (the same value as in Vercel). Without them the job does nothing.
name: Cron
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send queued messages
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "SITE_URL or CRON_SECRET not set; skipping"; exit 0; fi
          curl -fsS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/notifications"
