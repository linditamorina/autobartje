name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: autobartje
          POSTGRES_PASSWORD: autobartje
          POSTGRES_DB: autobartje
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U autobartje" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://autobartje:autobartje@localhost:5432/autobartje
      AUTH_SECRET: ci-only-secret-not-used-in-production-000000
      DATA_ENCRYPTION_KEY: Y2ktb25seS1rZXktMzItYnl0ZXMtbG9uZy0wMDAwMDA=
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # Log SMS/email instead of sending them
      NOTIFY_DRY_RUN: "1"
      # Cloudflare's documented always-pass test keys
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      # Private files (inspection photos) on disk instead of R2
      LOCAL_STORAGE_DIR: /tmp/autobartje-files
      # Stripe test values: the e2e test signs webhooks itself; no real Stripe account is used
      STRIPE_SECRET_KEY: sk_test_ci_not_a_real_key
      STRIPE_WEBHOOK_SECRET: whsec_ci_only_not_a_real_secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
