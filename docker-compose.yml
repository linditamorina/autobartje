# Local development: Postgres + MinIO (S3-compatible stand-in for R2).
# Run the app with `npm run dev`; or `docker compose --profile app up` for the production image.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: autobartje
      POSTGRES_PASSWORD: autobartje
      POSTGRES_DB: autobartje
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autobartje"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  app:
    profiles: [app]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://autobartje:autobartje@db:5432/autobartje
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
